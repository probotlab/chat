<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <style>
        :root {
            --bg: #0b141a;
            --header: #1f2c33;
            --in: #1f2c33;
            --out: #005c4b;
            --text-main: #ffffff;
            --text-dim: #8696a0;
            --input-bg: #2a3942;
            --accent: #00a884;
            --tick: #53bdeb;
            --danger: #ef4444;
        }

        html, body {
            margin: 0; padding: 0; width: 100%; height: 100%;
            overflow: hidden; background-color: var(--bg);
            font-family: 'Segoe UI', Helvetica, Arial, sans-serif;
            position: fixed;
        }

        #app-wrapper {
            display: flex; flex-direction: column; width: 100%; height: 100%; position: relative;
            background-image: url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png');
            background-repeat: repeat; background-size: 380px; background-color: var(--bg);
        }

        /* --- HEADER --- */
        header {
            position: absolute; top: 0; left: 0; right: 0; height: 60px;
            background: var(--header); display: flex; align-items: center;
            padding: 0 12px; justify-content: space-between; z-index: 1000;
        }
        .header-left { display: flex; align-items: center; }
        .dp { width: 40px; height: 40px; border-radius: 50%; background: url('https://images.unsplash.com/photo-1622253692010-333f2da6031d?q=80&w=100&auto=format&fit=crop') center/cover; margin-right: 12px; }
        .info h1 { margin: 0; font-size: 17px; font-weight: 500; color: #ffffff; }
        .info p { margin: 0; font-size: 12px; color: var(--accent); }
        .header-icons { display: flex; gap: 22px; align-items: center; }
        .header-icons svg { fill: #ffffff; }

        /* --- CHAT AREA --- */
        #chat-flow {
            position: absolute; top: 60px; bottom: 70px; left: 0; right: 0;
            overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 5px;
        }

        .msg { max-width: 85%; padding: 8px 10px; font-size: 15px; border-radius: 8px; line-height: 1.4; color: #e9edef; position: relative; }
        .received { align-self: flex-start; background: var(--in); border-top-left-radius: 0; }
        .sent { align-self: flex-end; background: var(--out); border-top-right-radius: 0; }
        .meta { font-size: 11px; color: #8696a0; float: right; margin: 4px 0 0 8px; display: flex; align-items: center; }
        .ticks { margin-left: 3px; letter-spacing: -3px; font-size: 15px; font-weight: bold; }
        .blue { color: var(--tick); }

        /* --- FOOTER & VOICE UI --- */
        footer {
            position: absolute; bottom: 0; left: 0; right: 0; height: 70px;
            background: transparent; padding: 8px 10px 15px 10px;
            display: flex; align-items: center; gap: 8px; z-index: 1000;
        }

        .input-container {
            background: var(--input-bg); flex: 1; border-radius: 25px;
            padding: 0 12px; display: flex; align-items: center; height: 48px; gap: 10px;
            position: relative; overflow: hidden;
        }

        /* The Voice Recording Overlay */
        #voice-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--input-bg); display: none; align-items: center;
            padding: 0 15px; gap: 15px; z-index: 5;
        }

        .record-dot { width: 10px; height: 10px; background: var(--danger); border-radius: 50%; animation: blink 0.8s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .timer { color: white; font-size: 16px; flex-grow: 1; }
        .slide-cancel { color: var(--text-dim); font-size: 14px; }

        input[type="search"] {
            width: 100%; background: transparent; border: none; color: white;
            outline: none; font-size: 17px; padding: 5px 0;
            -webkit-appearance: none; /* Removes X in search inputs */
        }

        .action-btn {
            width: 48px; height: 48px; background: var(--accent); border-radius: 50%;
            border: none; display: flex; align-items: center; justify-content: center;
            flex-shrink: 0; transition: transform 0.1s;
        }

        .hidden { display: none; }
        svg { fill: #8696a0; }
        .header-icons svg, .action-btn svg { fill: white; }
    </style>
</head>
<body>

<div id="app-wrapper">
    <header>
        <div class="header-left">
            <div class="dp"></div>
            <div class="info">
                <h1>NexClinic AI</h1>
                <p>online</p>
            </div>
        </div>
        <div class="header-icons">
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M17 10.5V7c0-.55-.45-1-1-1H4c-.55 0-1 .45-1 1v10c0 .55.45 1 1 1h12c.55 0 1-.45 1-1v-3.5l4 4v-11l-4 4z"/></svg>
            <svg width="22" height="22" viewBox="0 0 24 24"><path d="M20 15.5c-1.2 0-2.4-.2-3.6-.6-.3-.1-.7 0-1 .2l-2.2 2.2c-2.8-1.4-5.1-3.8-6.6-6.6l2.2-2.2c.3-.3.4-.7.2-1-.3-1.1-.5-2.3-.5-3.5 0-.6-.4-1-1-1H4c-.6 0-1 .4-1 1 0 9.4 7.6 17 17 17 .6 0 1-.4 1-1v-3.5c0-.6-.4-1-1-1z"/></svg>
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/></svg>
        </div>
    </header>

    <div id="chat-flow"></div>

    <footer>
        <div class="input-container">
            <div id="voice-overlay">
                <div class="record-dot"></div>
                <div class="timer" id="rec-timer">0:00</div>
                <div class="slide-cancel">Slide to cancel<</div>
            </div>

            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.41 0-8-3.59-8-8s3.59-8 8-8 8 3.59 8 8-3.59 8-8 8zm3.5-9c.83 0 1.5-.67 1.5-1.5S16.33 8 15.5 8 14 8.67 14 9.5s.67 1.5 1.5 1.5zm-7 0c.83 0 1.5-.67 1.5-1.5S9.33 8 8.5 8 7 8.67 7 9.5s.67 1.5 1.5 1.5zm3.5 6.5c2.33 0 4.31-1.46 5.11-3.5H6.89c.8 2.04 2.78 3.5 5.11 3.5z"/></svg>
           
            <input type="search" id="user-input" placeholder="Message" autocomplete="new-password" spellcheck="false">
           
            <svg width="24" height="24" viewBox="0 0 24 24"><path d="M16.5 6v11.5c0 2.21-1.79 4-4 4s-4-1.79-4-4V5c0-1.38 1.12-2.5 2.5-2.5s2.5 1.12 2.5 2.5v10.5c0 .55-.45 1-1 1s-1-.45-1-1V6H10v9.5c0 1.38 1.12 2.5 2.5 2.5s2.5-1.12 2.5-2.5V5c0-2.21-1.79-4-4-4S7 2.79 7 5v12.5c0 3.31 2.69 6 6 6s6-2.69 6-6V6h-1.5z"/></svg>
            <svg width="24" height="24" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3.2"/><path d="M9 2L7.17 4H4c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h16c1.1 0 2-.9 2-2V6c0-1.1-.9-2-2-2h-3.17L15 2H9zm3 15c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5z"/></svg>
        </div>

        <button class="action-btn" id="action-btn">
            <svg id="mic-icon" width="24" height="24" viewBox="0 0 24 24"><path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/><path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/></svg>
            <svg id="send-icon" class="hidden" width="24" height="24" viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
        </button>
    </footer>
</div>

<script>
    const flow = document.getElementById('chat-flow');
    const input = document.getElementById('user-input');
    const actionBtn = document.getElementById('action-btn');
    const micIcon = document.getElementById('mic-icon');
    const sendIcon = document.getElementById('send-icon');
    const voiceOverlay = document.getElementById('voice-overlay');
    const recTimer = document.getElementById('rec-timer');
    const wrapper = document.getElementById('app-wrapper');
    const ws = new WebSocket(`ws://${window.location.host}/ws`);

    let isRecording = false;
    let timerInterval;

    if (window.visualViewport) {
        window.visualViewport.addEventListener('resize', () => {
            wrapper.style.height = window.visualViewport.height + 'px';
            window.scrollTo(0, 0);
            flow.scrollTop = flow.scrollHeight;
        });
    }

    input.addEventListener('input', () => {
        if (input.value.trim().length > 0) {
            micIcon.classList.add('hidden');
            sendIcon.classList.remove('hidden');
        } else {
            micIcon.classList.remove('hidden');
            sendIcon.classList.add('hidden');
        }
    });

    function addMsg(text, type) {
        const id = 't' + Date.now();
        const div = document.createElement('div');
        div.className = `msg ${type}`;
        const time = new Date().toLocaleTimeString([], {hour: '2-digit', minute:'2-digit', hour12: false});
        let ticks = type === 'sent' ? `<span class="ticks" id="${id}">✓</span>` : '';
        div.innerHTML = `<span>${text}</span><div class="meta">${time}${ticks}</div>`;
        flow.appendChild(div);
        flow.scrollTop = flow.scrollHeight;

        if(type === 'sent') {
            const el = document.getElementById(id);
            setTimeout(() => { if(el) el.innerHTML = '✓✓'; }, 600);
            setTimeout(() => { if(el) { el.innerHTML = '✓✓'; el.classList.add('blue'); } }, 1500);
        }
    }

    ws.onopen = () => {
        setTimeout(() => addMsg("Assalam-u-Alaikum! NexClinic AI is here. How can I help you?", "received"), 400);
    };

    function startRecording() {
        isRecording = true;
        voiceOverlay.style.display = 'flex';
        let seconds = 0;
        timerInterval = setInterval(() => {
            seconds++;
            const mins = Math.floor(seconds / 60);
            const secs = seconds % 60;
            recTimer.innerText = `${mins}:${secs.toString().padStart(2, '0')}`;
        }, 1000);
    }

    function stopRecording() {
        isRecording = false;
        clearInterval(timerInterval);
        voiceOverlay.style.display = 'none';
        recTimer.innerText = '0:00';
        addMsg("🎤 Voice message sent (Demo)", "sent");
    }

    actionBtn.onclick = () => {
        const val = input.value.trim();
        if (val) {
            addMsg(val, 'sent');
            ws.send(val);
            input.value = '';
            micIcon.classList.remove('hidden');
            sendIcon.classList.add('hidden');
        } else {
            // Toggle Voice UI
            if (!isRecording) startRecording();
            else stopRecording();
        }
    };

    input.onkeypress = (e) => { if(e.key === 'Enter') actionBtn.onclick(); };
    ws.onmessage = (e) => addMsg(e.data, 'received');
</script>
</body>
</html>
